<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Monde — Diplomacy Lab</title>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <!-- Notre design -->
    <link rel="stylesheet" href="css/monde.css">
</head>

<body>

    <header class="topbar">

        <div class="brand">
            <span class="brand-name">DIPLOMACY LAB</span>
            <span class="brand-section">WORLD</span>
        </div>

        <div class="search">
            <span class="search-icon">🔍</span>
            <input
                type="text"
                id="countrySearch"
                placeholder="Rechercher un pays, une capitale, un code..."
                autocomplete="off"
                spellcheck="false"
            >
            <button type="button" id="clearSearch" class="search-clear" title="Effacer la recherche">×</button>
            <div
                id="searchResults"
                class="search-results">
            </div>
        </div>
    </header>


    <main>

        <section class="intro">

            <div>
                <p class="eyebrow">WORLD / CARTOGRAPHIE</p>

                <h1>
                    Le monde,<br>
                    <span>à travers la géopolitique.</span>
                </h1>

                <p class="description">
                    Explorez les États du monde et leurs données
                    géographiques, démographiques et économiques.
                </p>
            </div>

            <div class="update">
                <span>DONNÉES</span>
                <strong id="updateStatus">Connexion...</strong>
            </div>

        </section>


        <section class="map-container">

            <div id="map"></div>

            <div class="map-controls">

                <button class="layer active" data-layer="political" onclick="switchPanelView('political')">
                    Politique
                </button>

                <button class="layer" data-layer="economy" onclick="switchPanelView('economy')">
                    Économie
                </button>

                <button class="layer" data-layer="population" onclick="switchPanelView('demography')">
                    Population
                </button>

            </div>

        </section>


        <aside id="countryPanel" class="country-panel">

            <button id="closePanel" class="close">
                ×
            </button>

            <div id="countryContent">

                <p class="panel-placeholder">
                    Sélectionnez un pays sur la carte.
                </p>

            </div>

        </aside>

    </main>


    <footer>

        <div>
            <strong>DIPLOMACY LAB</strong>
            <span>WORLD</span>
        </div>

        <div>
            Données : Banque mondiale
        </div>

    </footer>


    <!-- Leaflet -->
<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<!-- Module Politique -->
<script src="politique.js?v=3.1"></script>

<!-- Module Économie -->
<script src="economie.js?v=3.1"></script>

<!-- Module Démographie -->
<script src="demographie.js?v=3.1"></script>

<!-- Notre JavaScript (avec support dossier js/ et racine + cache-busting v=3.1) -->
<script src="js/monde.js?v=3.1"></script>
<script>
if (typeof window.switchPanelView === "undefined") {
    var fallbackScript = document.createElement("script");
    fallbackScript.src = "monde.js?v=3.1";
    document.body.appendChild(fallbackScript);
}
</script>

</body>
</html>
